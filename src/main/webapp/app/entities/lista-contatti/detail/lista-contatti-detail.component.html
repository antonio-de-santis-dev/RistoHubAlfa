<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (listaContatti(); as listaContattiRef) {
      <div>
        <h2 data-cy="listaContattiDetailsHeading"><span jhiTranslate="ristoHubAlfaApp.listaContatti.detail.title">Lista Contatti</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ listaContattiRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="ristoHubAlfaApp.listaContatti.note">Note</span></dt>
          <dd>
            <span>{{ listaContattiRef.note }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Indietro</span>
        </button>

        <button type="button" [routerLink]="['/lista-contatti', listaContattiRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Modifica</span>
        </button>
      </div>
    }
  </div>
</div>
