<!doctype html>
<!-- PERCORSO: src/main/webapp/index.html -->
<!-- Sostituisce il file JHipster di default. -->
<!-- Cambiamenti: splash loader RistoHub, favicon, titolo, theme-color. -->
<html class="no-js" lang="it" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>RistoHub</title>
    <meta name="description" content="RistoHub – Il tuo menu digitale professionale" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#1a1a1a" />
    <base href="/" />

    <!-- Favicon RistoHub -->
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="content/images/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="content/images/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="content/images/apple-touch-icon.png?v=2" />

    <link rel="manifest" href="manifest.webapp" />
    <!-- Splash screen CSS (caricato prima di Angular) -->
    <link rel="stylesheet" href="content/css/loading.css" />
    <!-- jhipster-needle-add-resources-to-root - JHipster will add new resources here -->
  </head>
  <body>
    <!--[if lt IE 9]>
      <p class="browserupgrade">
        You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve
        your experience.
      </p>
    <![endif]-->

    <jhi-app>
      <!-- Splash screen RistoHub — visibile finché Angular non fa il bootstrap.
       Sostituisce il pac-man di JHipster. Richiede loading.css. -->
      <div class="app-loading">
        <div class="rh-splash-icon">
          <!-- Logo bianco su sfondo scuro -->
          <img src="content/images/LogoBianco.png" alt="RistoHub" />

          <!-- Piatto animato + posate -->
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Anello esterno oro -->
            <circle class="rh-plate-outer" cx="100" cy="108" r="62" fill="none" stroke="#FFD200" stroke-width="8" stroke-linecap="round" />
            <!-- Anello interno turchese -->
            <circle class="rh-plate-inner" cx="100" cy="108" r="40" fill="none" stroke="#3DD6C8" stroke-width="8" stroke-linecap="round" />
            <!-- Forchetta (sinistra) -->
            <g class="rh-fork" style="transform-origin: 58px 92px">
              <path
                d="M14 75 L14 130 Q14 136 20 136 Q26 136 26 130 L26 75"
                fill="none"
                stroke="#FFFFFF"
                stroke-width="7.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                transform="translate(34,30)"
              />
              <path
                d="M14 75 Q20 82 26 75"
                fill="none"
                stroke="#FFFFFF"
                stroke-width="7.5"
                stroke-linecap="round"
                transform="translate(34,30)"
              />
              <line x1="44" y1="70" x2="44" y2="102" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
              <line x1="54" y1="66" x2="54" y2="102" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
              <line x1="64" y1="70" x2="64" y2="102" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
            </g>
            <!-- Coltello (destra) -->
            <g class="rh-knife" style="transform-origin: 159px 92px">
              <path
                d="M13 80 L13 130 Q13 136 19 136 Q25 136 25 130 L25 80"
                fill="none"
                stroke="#FFFFFF"
                stroke-width="7.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                transform="translate(140,30)"
              />
              <path
                d="M13 80 L13 42 Q13 36 22 36 Q28 40 25 80"
                fill="none"
                stroke="#FFFFFF"
                stroke-width="7"
                stroke-linecap="round"
                stroke-linejoin="round"
                transform="translate(140,30)"
              />
            </g>
          </svg>

          <div class="rh-splash-text">Caricamento</div>
          <div class="rh-splash-dots"><span></span><span></span><span></span></div>
        </div>
      </div>

      <!-- Errore di caricamento (mostrato dopo 4s se Angular non parte) -->
      <div id="jhipster-error" style="display: none; padding: 2rem; font-family: sans-serif">
        <h2>Errore di caricamento</h2>
        <p>L'applicazione non si è avviata. Assicurati che il server sia in esecuzione.</p>
      </div>
    </jhi-app>

    <noscript>
      <h1>JavaScript è necessario per utilizzare questa applicazione.</h1>
    </noscript>
    <script type="text/javascript">
      window.onload = function () {
        setTimeout(showError, 4000);
      };
      function showError() {
        const errorElm = document.getElementById('jhipster-error');
        if (errorElm?.style) {
          errorElm.style.display = 'block';
        }
      }
    </script>
  </body>
</html>
